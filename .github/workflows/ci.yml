name: CI Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv sync --extra dev
      - name: Ruff check
        run: uv run ruff check src/rlmstudio/ tests/
      - name: Ruff format check
        run: uv run ruff format --check src/rlmstudio/ tests/
      - name: No legacy 'rlmkit' module paths
        # The package is `rlmstudio`. Legacy *names* are allowed where they are
        # the documented compatibility surface (RLMKIT_* env fallback, ~/.rlmkit
        # migration, CHANGELOG history, specs), but no code, doc, or config may
        # still import / invoke the old module path.
        run: |
          # Portable ERE — no \b (unsupported by BSD grep, so a local run on
          # macOS would silently pass while GNU grep on CI fails).
          W='([^A-Za-z0-9_]|$)'
          if git grep -nE "(from|import) rlmkit${W}|(^|[^A-Za-z0-9_])rlmkit\.(server|cli|api|application|infrastructure|domain|llm|prompts|core|envs|ui|storage|telemetry|branding|config)${W}|-m rlmkit${W}" -- . ':!CHANGELOG.md' ':!specs/' ':!doc_internal/' ':!.github/workflows/ci.yml'; then
            echo '::error::Legacy rlmkit module paths found (see above)'; exit 1
          fi
          echo 'OK: no legacy rlmkit module paths'

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv sync --extra dev
      - name: Mypy
        run: uv run mypy src/rlmstudio/ --ignore-missing-imports

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv sync --extra dev --extra studio --extra interop
      - name: Run tests with coverage
        # --runslow includes spawn-heavy tests like TestTopLevelScriptEntrypoint
        # which are gated by default for local dev speed but MUST run in CI.
        # -n auto from pyproject.toml [tool.pytest.ini_options] addopts parallelizes.
        run: uv run pytest tests/ --runslow --cov=rlmstudio --cov-report=term-missing --cov-report=xml --cov-fail-under=80 -q
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  test-frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # package.json declares engines.node >=22 and vitest 5 requires
          # ^22.12 || ^24; keep in step with the wheel-smoke job.
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix frontend
      - name: TypeScript check
        run: cd frontend && npx tsc --noEmit
      - name: Lint
        run: npm run lint --prefix frontend
      - name: Test
        run: npm run test --prefix frontend
      - name: Build
        run: npm run build --prefix frontend

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      # Audit the full user-facing surface (`all` = studio + eval + interop)
      # plus the dev toolchain.
      - run: uv sync --extra dev --extra all
      - name: Bandit security scan
        run: uv run bandit -r src/rlmstudio/server/ src/rlmstudio/application/ src/rlmstudio/domain/ src/rlmstudio/infrastructure/ -c pyproject.toml
      - name: pip-audit vulnerability scan
        run: uv run pip-audit --skip-editable

  docker-sandbox:
    name: Docker Sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sandbox image
        run: docker build -t rlm-studio-sandbox -f docker/Dockerfile.sandbox docker/
      - name: Smoke test sandbox image
        run: docker run --rm --network=none rlm-studio-sandbox python3 -c "print('sandbox OK')"

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv sync --extra studio
      - name: Verify package imports
        run: uv run python -c "from rlmstudio.server.app import app; print('Server OK')"

  wheel-smoke:
    name: Wheel Smoke (bundled UI, py${{ matrix.python }})
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Build the bundled Studio UI (static export)
        run: |
          npm ci --prefix frontend
          npm run build:bundle --prefix frontend
          test -f frontend/out/index.html
      - name: Ship the bundle inside the package (same steps as RELEASING.md)
        run: |
          find src/rlmstudio/_ui -mindepth 1 -not -name __init__.py -delete
          cp -r frontend/out/. src/rlmstudio/_ui/
          test -f src/rlmstudio/_ui/__init__.py
          test -f src/rlmstudio/_ui/index.html
      - name: Build wheel + sdist
        run: uv build
      - name: Wheel contents — bundled UI present, no legacy paths
        run: |
          uv run --no-project python - <<'PY'
          import glob, zipfile, sys
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          assert "rlmstudio/_ui/index.html" in names, "bundled UI missing from wheel"
          assert "rlmstudio/_ui/__init__.py" in names, "_ui package marker missing"
          assert any(n.startswith("rlmstudio/prompts/") and n.endswith(".yaml") for n in names), "prompts missing"
          legacy = [n for n in names if n.startswith("rlmkit/")]
          assert not legacy, f"legacy rlmkit/ paths in wheel: {legacy[:5]}"
          ep = [n for n in names if n.endswith("entry_points.txt")][0]
          txt = zipfile.ZipFile(whl).read(ep).decode()
          assert "rlm-studio = rlmstudio.cli.main:main" in txt, txt
          print("wheel OK:", whl, len(names), "files")
          PY
      - name: Fresh-venv install of the wheel [studio] on Python ${{ matrix.python }}
        run: |
          uv venv --python ${{ matrix.python }} /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python "$(ls dist/*.whl)[studio]"
          /tmp/smoke/bin/rlm-studio --help
          /tmp/smoke/bin/rlm-studio version
          /tmp/smoke/bin/python -c "import rlmstudio; from rlmstudio import interact; import rlmstudio.server.app; print('import OK', rlmstudio.__version__)"
      - name: Boot smoke — rlm-studio studio serves /health and /studio/
        env:
          RLM_STUDIO_DIR: /tmp/smoke-state
        run: |
          /tmp/smoke/bin/rlm-studio studio --no-browser --port 8765 > /tmp/studio.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8765/health >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8765/health
          echo
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/studio/)" = "200"
          curl -s http://127.0.0.1:8765/studio/ | grep -q "RLM Studio"
          kill %1 || true
          tail -5 /tmp/studio.log

